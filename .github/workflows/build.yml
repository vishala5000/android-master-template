name: Auto Build & Sign APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # FIX 1: Use ubuntu-24.04 explicitly to avoid the future Ubuntu 26 migration warning
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # FIX 2: Upgraded to setup-java@v5 to resolve the deprecation warning
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Explicitly pin Gradle to 8.4 to prevent Android Gradle Plugin incompatibility
          gradle-version: '8.4'

      - name: Generate Auto-Sign Keystore
        run: |
          keytool -genkey -v -keystore auto.jks -alias auto -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass auto123 -keypass auto123 -dname "CN=AutoCI"

      - name: Build & Auto-Sign Release APK
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/auto.jks \
            -Pandroid.injected.signing.store.password=auto123 \
            -Pandroid.injected.signing.key.alias=auto \
            -Pandroid.injected.signing.key.password=auto123

      - name: Find and Prepare APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p ./output
          cp "$APK" ./output/app-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK
          path: ./output/app-release.apk
