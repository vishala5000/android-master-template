name: Android Build and Auto-Sign

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Auto-Sign Release APK
      # This step will:
      # 1. Run the 'downloadReleaseAssets' Gradle task to fetch files from GitHub.
      # 2. Compile the app.
      # 3. Automatically sign the APK using the default keystore (via apksigner).
      # NO secrets are required.
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TalkingFace-Release-Signed
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
