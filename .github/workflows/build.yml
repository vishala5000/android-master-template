name: Auto Build & Sign APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest is the most stable for Android builds
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        # CRITICAL FIX: Removed 'gradle-version' so it safely uses your project's wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Auto-Sign Keystore
        run: |
          keytool -genkey -v -keystore auto.jks -alias auto -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass auto123 -keypass auto123 -dname "CN=AutoCI"

      - name: Build & Auto-Sign Release APK
        run: |
          # CRITICAL FIX: Changed 'gradle' to './gradlew'
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/auto.jks \
            -Pandroid.injected.signing.store.password=auto123 \
            -Pandroid.injected.signing.key.alias=auto \
            -Pandroid.injected.signing.key.password=auto123

      - name: Find and Prepare APK
        run: |
          # CRITICAL FIX: Pointed directly to the release folder to avoid picking up debug APKs
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p ./output
          cp "$APK" ./output/app-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK
          path: ./output/app-release.apk
