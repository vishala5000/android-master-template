name: Build TalkingFace Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Create required directories
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets

      - name: Download sherpa-onnx Android native libraries
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2 -O /tmp/sherpa.tar.bz2
          rm -rf /tmp/sherpa && mkdir -p /tmp/sherpa
          tar -xjf /tmp/sherpa.tar.bz2 -C /tmp/sherpa
          find /tmp/sherpa -path "*/arm64-v8a/*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          echo "✓ Native libraries extracted."
          ls -lh app/src/main/jniLibs/arm64-v8a

      - name: Download sherpa Kotlin API (Tts.kt)
        run: |
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          wget -q https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/sherpa-onnx/kotlin-api/Tts.kt -O app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
          echo "✓ Tts.kt downloaded."

      - name: Download Piper model (includes .onnx, tokens.txt, and espeak-ng-data)
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ljspeech-medium.tar.bz2 -O /tmp/piper.tar.bz2
          rm -rf /tmp/piper && mkdir -p /tmp/piper
          tar -xjf /tmp/piper.tar.bz2 -C /tmp/piper
          cp -r /tmp/piper/vits-piper-en_US-ljspeech-medium/* app/src/main/assets/
          echo "✓ Piper model, tokens.txt, and espeak-ng-data extracted to assets."
          ls -lh app/src/main/assets

      - name: Download app assets (talkingface.mp4, font.ttf) from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download assets --repo vishala5000/android-master-template --pattern "talkingface.mp4" --pattern "font.ttf" --dir app/src/main/assets/
          echo "✓ App assets downloaded."
          ls -lh app/src/main/assets

      - name: Clean Gradle build
        run: gradle clean --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TalkingFace-Release-Signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
