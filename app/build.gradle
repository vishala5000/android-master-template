import java.net.URL

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Task to download assets from GitHub release during the build process
task downloadReleaseAssets {
    def assetDir = file("$projectDir/src/main/assets")
    assetDir.mkdirs()
    
    def filesToDownload = [
        "talkingface.mp4",
        "en_US-ljspeech-medium.onnx",
        "en_US-ljspeech-medium.onnx.json",
        "font.ttf"
    ]
    def baseUrl = "https://github.com/vishala5000/android-master-template/releases/download/assets/"
    
    doLast {
        filesToDownload.each { fileName ->
            def destFile = file("$assetDir/$fileName")
            if (!destFile.exists()) {
                println "Downloading $fileName to assets..."
                def url = new URL(baseUrl + fileName)
                def connection = url.openConnection()
                connection.setRequestProperty("User-Agent", "Mozilla/5.0")
                destFile.withOutputStream { out ->
                    out << connection.getInputStream()
                }
            } else {
                println "$fileName already exists in assets, skipping."
            }
        }
    }
}

preBuild.dependsOn downloadReleaseAssets

android {
    namespace 'com.example.talkingface'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.talkingface"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CRITICAL: Auto-signs the release build using the default debug keystore.
            // This guarantees a signed APK without requiring any GitHub Secrets.
            signingConfig signingConfigs.debug
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Official community-maintained drop-in replacement for FFmpegKit
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
}
