plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Auto-download the AAR if it's missing (fixes CI/CD environments where libs/ is not committed)
def aarFile = file("libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar")
if (!aarFile.exists()) {
    logger.warn("FFmpegKit AAR not found locally. Downloading from GitHub release...")
    file("libs").mkdirs()
    def aarUrl = "https://github.com/vishala5000/android-master-template/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar"
    try {
        aarFile.withOutputStream { out ->
            new URL(aarUrl).withInputStream { from -> out << from }
        }
        logger.warn("FFmpegKit AAR downloaded successfully.")
    } catch (Exception e) {
        logger.error("Failed to download FFmpegKit AAR: ${e.message}")
        throw new GradleException("Failed to download FFmpegKit AAR. Please ensure the release asset exists.")
    }
}

android {
    namespace 'com.example.vidgene'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.vidgene"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation files('libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar')
}
