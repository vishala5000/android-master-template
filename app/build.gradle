plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.talkingface'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.talkingface"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // FIXED: Original com.arthenica artifacts were removed from Maven Central in April 2025.
    // This is the official community-maintained drop-in replacement (same package names/imports).
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
